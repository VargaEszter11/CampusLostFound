server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: no CORS needed
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html names the hashed bundles, so it must be revalidated or users keep an old build after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed file names change on every build, so these can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
