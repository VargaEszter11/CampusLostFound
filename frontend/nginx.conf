server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. With a literal host in proxy_pass nginx resolves "backend" once at startup and keeps
    # that IP, so every /api call fails with 502 after the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Same-origin API: no CORS needed
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html names the hashed bundles, so it must be revalidated or users keep an old build after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed file names change on every build, so these can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
